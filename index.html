.section-title{margin:0 0 22px!important;font-size:15px!important;letter-spacing:3px;color:var(--orange2)!important}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:230px;height:54px;margin:7px 6px!important;padding:0 22px;border:1px solid rgba(255,106,0,.55);border-radius:13px;background:linear-gradient(135deg,#17283b,#0b1421);color:#fff;font-size:15px;font-weight:800;letter-spacing:.4px;cursor:pointer;box-shadow:0 7px 20px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.07);transition:.2s ease}
.btn:hover{transform:translateY(-3px);border-color:var(--orange);background:linear-gradient(135deg,#263b51,#101b2b);box-shadow:0 10px 26px rgba(255,106,0,.18),0 0 0 1px rgba(255,106,0,.15)}
.btn-multi{border-color:var(--cyan);box-shadow:0 0 20px rgba(141,231,229,.12)}
.btn-onln{margin-top:32px!important;margin-bottom:25px!important;width:min(468px,100%)!important}
.facebook-footer{margin-top:28px;color:var(--muted);font-size:14px;letter-spacing:.5px}
.facebook-footer strong{color:var(--cyan)}
#crypto{display:none}
#crypto h1{font-size:15px!important;color:var(--orange2)!important;letter-spacing:1px}
#crypto img{border-radius:15px;box-shadow:0 0 25px rgba(255,106,0,.15)}
@media(max-width:600px){body{padding:18px 9px 30px}.logo{width:135px;height:135px}.btn{width:100%;margin:6px 0!important}.brand-subtitle{letter-spacing:2px}.facebook-footer{font-size:13px}}
