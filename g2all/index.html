<!DOCTYPE html>
<html>
<head>
<title>GAME SHOP ORAN - PS4 GoldHEN</title>
<link rel="stylesheet" href="../style.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(circle at 50% 20%,rgba(255,115,0,.16),transparent 32%),linear-gradient(145deg,#05080d,#071522 50%,#030508);color:#fff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,255,180,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,180,.035) 1px,transparent 1px);background-size:42px 42px}
.game-header{width:min(1100px,94%);margin:28px auto 0;padding:25px 20px 20px;text-align:center;border:1px solid rgba(255,115,0,.35);border-radius:24px;background:rgba(4,14,24,.9);box-shadow:0 0 35px rgba(255,100,0,.12),inset 0 0 30px rgba(0,210,255,.04)}
.logo{width:130px;height:130px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 14px;border:4px solid #ff7300;box-shadow:0 0 0 5px rgba(0,220,255,.18),0 0 28px rgba(255,115,0,.35)}
.brand{margin:0;font-size:clamp(32px,6vw,58px);font-weight:900;letter-spacing:3px;line-height:1;color:#fff;text-shadow:0 0 14px rgba(0,210,255,.2)}
.brand span{color:#ff7300}
.tagline{margin:12px 0 0;color:#9defff;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.panel{width:min(900px,92%);margin:26px auto;padding:25px 20px 28px;text-align:center;border-radius:22px;border:1px solid rgba(0,220,255,.22);background:rgba(7,17,28,.9);box-shadow:0 15px 45px rgba(0,0,0,.45)}
.status{margin:0 0 22px;font-size:clamp(20px,3vw,30px)!important;line-height:1.35;color:#fff}
.status:before{content:"●";color:#ff7300;margin-right:10px;text-shadow:0 0 12px #ff7300}
.footer{width:min(900px,92%);margin:18px auto 35px;text-align:center;padding:16px;color:#b9c7d2;font-size:15px;border-top:1px solid rgba(255,115,0,.22)}
.facebook{color:#ff7300;font-weight:800;text-decoration:none;margin-left:7px}
.facebook:hover{color:#9defff}
hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#ff7300,#00d9ff,transparent);margin:0 auto;width:min(900px,85%)}
@media(max-width:600px){.game-header{margin-top:14px;padding:20px 12px}.logo{width:105px;height:105px}.tagline{font-size:11px;letter-spacing:1px}.panel{padding:22px 12px}.footer{font-size:13px}}
</style>

<style id="game-shop-background-fix">
html, body {
    background-image: none !important;
}
body {
    background:
      radial-gradient(circle at 50% 20%, rgba(255,115,0,.16), transparent 32%),
      linear-gradient(145deg,#05080d,#071522 50%,#030508) !important;
    background-attachment: fixed !important;
}
</style>

</head>
<body>
<section class="game-header">
<img class="logo" src="../img.jpg" alt="Game Shop Oran">
<h1 class="brand">GAME SHOP <span>ORAN</span></h1>
<p class="tagline">PS4 • GoldHEN • Gaming Experience</p>
</section>
<hr>
<section class="panel">
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=10";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
</section>
<footer class="footer">
Page Facebook : <a class="facebook" href="#" aria-label="Game Shop Oran Facebook">Game Shop Oran</a>
</footer>
</body>
</html>
